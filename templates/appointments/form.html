{% extends 'base.html' %}
{% block title %}حجز موعد - {{ clinic_name }}{% endblock %}
{% block page_title %}حجز موعد جديد{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('appointments_list') }}">المواعيد</a> / جديد{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header"><i class="fas fa-calendar-plus text-primary"></i> بيانات الموعد</div>
  <div class="card-body">
    <form method="post">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">المريض *</label>
          <select name="patient_id" class="form-select" required>
            <option value="">-- اختر المريض --</option>
            {% for p in patients %}
            <option value="{{ p.id }}" {% if preselect == p.id %}selected{% endif %}>{{ p.full_name }} ({{ p.code }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">التاريخ *</label>
          <input type="date" name="date" class="form-control" value="{{ today.strftime('%Y-%m-%d') }}" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">الوقت *</label>
          <input type="time" name="time" class="form-control" value="10:00" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">المدة (دقيقة)</label>
          <input type="number" name="duration" class="form-control" value="60" min="15" step="15">
        </div>
        <div class="col-md-9">
          <label class="form-label">سبب الزيارة</label>
          <input type="text" name="reason" class="form-control" placeholder="مثال: متابعة، جلسة علاج...">
        </div>
        <div class="col-12">
          <label class="form-label">ملاحظات</label>
          <textarea name="notes" class="form-control" rows="2"></textarea>
        </div>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> حجز الموعد</button>
        <a href="{{ url_for('appointments_list') }}" class="btn btn-outline-secondary">إلغاء</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
