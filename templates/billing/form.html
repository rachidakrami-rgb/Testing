{% extends 'base.html' %}
{% block title %}فاتورة جديدة - {{ clinic_name }}{% endblock %}
{% block page_title %}إنشاء فاتورة{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('billing_list') }}">الفواتير</a> / جديدة{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header"><i class="fas fa-file-invoice-dollar text-primary"></i> بيانات الفاتورة</div>
  <div class="card-body">
    <form method="post">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">المريض *</label>
          <select name="patient_id" class="form-select" required>
            <option value="">-- اختر المريض --</option>
            {% for p in patients %}
            <option value="{{ p.id }}" {% if preselect == p.id %}selected{% endif %}>{{ p.full_name }} ({{ p.code }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">تاريخ الفاتورة</label>
          <input type="date" name="invoice_date" class="form-control" value="{{ today.strftime('%Y-%m-%d') }}">
        </div>
        <div class="col-md-3">
          <label class="form-label">طريقة الدفع</label>
          <select name="payment_method" class="form-select">
            <option value="cash">نقدي</option>
            <option value="card">بطاقة</option>
            <option value="transfer">تحويل</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">المبلغ الإجمالي *</label>
          <input type="number" name="amount" class="form-control" step="0.01" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">المبلغ المدفوع</label>
          <input type="number" name="paid_amount" class="form-control" step="0.01" value="0">
        </div>
        <div class="col-12">
          <label class="form-label">الوصف</label>
          <textarea name="description" class="form-control" rows="2" placeholder="مثال: جلسة علاج نفسي..."></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">ملاحظات</label>
          <textarea name="notes" class="form-control" rows="2"></textarea>
        </div>
      </div>
      <div class="mt-4">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> حفظ الفاتورة</button>
        <a href="{{ url_for('billing_list') }}" class="btn btn-outline-secondary">إلغاء</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
