{% extends 'base_public.html' %}
{% block title %}مراسلة الطبيب - {{ clinic_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="text-center mb-4">
      <h2><i class="fas fa-envelope-open-text text-primary"></i> مراسلة الطبيب</h2>
      <p class="text-muted">أرسل استفسارك وسيرد عليك الطبيب في أقرب وقت</p>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">الاسم الكامل <span class="text-danger">*</span></label>
            <input type="text" name="full_name" class="form-control" required
                   placeholder="مثال: محمد أحمد">
          </div>
          <div class="mb-3">
            <label class="form-label">رقم الهاتف <span class="text-danger">*</span></label>
            <input type="tel" name="phone" class="form-control" required
                   placeholder="للتواصل والرد عليك" pattern="[0-9+\s]{6,}">
          </div>
          <div class="mb-3">
            <label class="form-label">رسالتك <span class="text-danger">*</span></label>
            <textarea name="body" class="form-control" rows="5" required
                      placeholder="اكتب استفسارك أو ملاحظتك هنا..."></textarea>
          </div>
          <div class="alert alert-info py-2 small mb-3">
            <i class="fas fa-shield-halved"></i>
            لا ترسل معلومات طبية بالغة الحساسية هنا. للأمور العاجلة اتصل بالعيادة مباشرة.
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="fas fa-paper-plane"></i> إرسال الرسالة
          </button>
        </form>
      </div>
    </div>

    <div class="text-center mt-3">
      <a href="{{ url_for('portal_home') }}" class="text-muted">
        <i class="fas fa-arrow-right"></i> رجوع لبوابة المريض
      </a>
    </div>
  </div>
</div>
{% endblock %}
